name: Update AMO listing

# Pushes the AMO listing text, icon and screenshots from store-assets/ whenever
# they change on main (or on demand: push a tag like "amo-listing-v2", or run
# the workflow manually). Reuses the account-level AMO_JWT_* secrets and is
# idempotent (existing screenshots are replaced). It never touches the signed
# add-on version. AMO throttles API writes; if it answers 429 with a long
# Retry-After the job fails fast, so re-run it later.

on:
  push:
    branches: [main]
    paths:
      - "store-assets/dist/**"
      - "store-assets/listing/description.txt"
      - "store-assets/amo_listing.py"
    tags:
      - "amo-listing-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: amo-listing
  cancel-in-progress: false

jobs:
  update-listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - name: Update description, icon, screenshots on AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON: google-ai-overview-scraper
        run: python3 store-assets/amo_listing.py
